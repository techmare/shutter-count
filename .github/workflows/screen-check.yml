name: Screen check

# Builds a debug APK, opens every state of the app on an emulator in light, dark and large text,
# and pushes the screenshots to the check-results branch.
on:
  workflow_dispatch:
  push:
    branches: ['check-*']

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/screencheck.sh
      - name: Push screenshots
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b check-results
          git config user.name "screen-check"; git config user.email "screen-check@users.noreply.github.com"
          git add -A && git commit -qm "Screens for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" check-results
