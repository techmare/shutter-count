name: Build Mac app (Mojave/Catalina)

on:
  push:
    branches: [main]
    paths: ["macos-legacy/**", "macos/Sources/ShutterCore/**", "macos/Resources/**", ".github/workflows/mac-legacy.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: macos-legacy
        run: |
          set -e
          set -o pipefail
          if ! swift build -c release --arch arm64 --arch x86_64 2>&1 | tee build.log; then
            grep -E "error:" build.log | sort -u | head -45 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          fi
          grep -E "warning:" build.log | grep -v "deprecated" | sort -u | head -20 | while IFS= read -r l; do echo "::warning::${l}"; done || true
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/ShutterCountLegacy"
          APP="Shutter Count Legacy.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/Fonts"
          cp "$BIN" "$APP/Contents/MacOS/ShutterCountLegacy"
          cp ../macos/Resources/Fonts/*.ttf "$APP/Contents/Resources/Fonts/"
          sed -e "s/__VERSION__/1.0.${{ github.run_number }}/" -e "s/__BUILD__/${{ github.run_number }}/" Resources/Info.plist > "$APP/Contents/Info.plist"
          mkdir -p AppIcon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s ../macos/Resources/AppIcon-1024.png --out AppIcon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d ../macos/Resources/AppIcon-1024.png --out AppIcon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          lipo -info "$APP/Contents/MacOS/ShutterCountLegacy"
          # must only need libraries that ship with macOS 10.14.4
          otool -L "$APP/Contents/MacOS/ShutterCountLegacy" | tee libs.txt
          otool -l "$APP/Contents/MacOS/ShutterCountLegacy" | grep -A3 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | head -12
          if grep -q "Concurrency" libs.txt; then echo "::error::links the Swift concurrency runtime, which Mojave doesn't have"; exit 1; fi
          ditto -c -k --keepParent "$APP" ../ShutterCountLegacy-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ShutterCountLegacy-mac
          path: ShutterCountLegacy-mac.zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-legacy-latest
          name: Shutter Count for Mac (Mojave / Catalina)
          body: |
            For macOS 10.14.4 Mojave, 10.15 Catalina and newer. For Big Sur or later the regular Mac app is nicer.
            Download **ShutterCountLegacy-mac.zip**, unzip it and drag **Shutter Count Legacy** to Applications.
            First launch: right-click the app and choose Open, because it isn't notarized by Apple.
            Build ${{ github.run_number }}.
          files: ShutterCountLegacy-mac.zip
          make_latest: false
          overwrite_files: true
